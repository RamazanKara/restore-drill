name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Syft
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b "$HOME/.local/bin" v1.44.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/syft" version

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.15.4
          args: check

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.15.4
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign container images
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/ramazankara/restore-drill"
          cosign sign --yes "${image}:${version}"
          cosign sign --yes "${image}:${version}-amd64"
          cosign sign --yes "${image}:${version}-arm64"
          cosign sign --yes "${image}:latest"

      - name: Sign checksums
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle dist/checksums.txt.bundle dist/checksums.txt
          gh release upload "$GITHUB_REF_NAME" dist/checksums.txt.bundle --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release checksums
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/checksums.txt
