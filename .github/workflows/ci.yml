# Optional local checks: make verify cover test-integration test-k8s docker-smoke docs snapshot release; see Makefile, scripts/ and test/k8s/.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOMAXPROCS: "2"
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --concurrency=2

      - name: Unit tests
        run: make -j2 test-unit

      - name: Build
        run: make -j2 build
