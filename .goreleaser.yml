version: 2

project_name: restore-drill

builds:
  - id: restore-drill
    main: ./cmd/restore-drill
    binary: restore-drill
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
        -X github.com/RamazanKara/restore-drill/internal/version.Version={{.Version}}
        -X github.com/RamazanKara/restore-drill/internal/version.Commit={{.Commit}}
        -X github.com/RamazanKara/restore-drill/internal/version.Date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

dockers:
  - image_templates:
      - "ghcr.io/ramazankara/restore-drill:{{ .Version }}-amd64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=restore-drill"
      - "--label=org.opencontainers.image.description=Automated backup restore verification for PostgreSQL, MySQL/MariaDB, and Redis."
      - "--label=org.opencontainers.image.source=https://github.com/RamazanKara/restore-drill"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
    dockerfile: Dockerfile.goreleaser
  - image_templates:
      - "ghcr.io/ramazankara/restore-drill:{{ .Version }}-arm64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=restore-drill"
      - "--label=org.opencontainers.image.description=Automated backup restore verification for PostgreSQL, MySQL/MariaDB, and Redis."
      - "--label=org.opencontainers.image.source=https://github.com/RamazanKara/restore-drill"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
    goarch: arm64
    dockerfile: Dockerfile.goreleaser

docker_manifests:
  - name_template: "ghcr.io/ramazankara/restore-drill:{{ .Version }}"
    image_templates:
      - "ghcr.io/ramazankara/restore-drill:{{ .Version }}-amd64"
      - "ghcr.io/ramazankara/restore-drill:{{ .Version }}-arm64"
  - name_template: "ghcr.io/ramazankara/restore-drill:latest"
    image_templates:
      - "ghcr.io/ramazankara/restore-drill:{{ .Version }}-amd64"
      - "ghcr.io/ramazankara/restore-drill:{{ .Version }}-arm64"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"

sboms:
  - artifacts: archive
