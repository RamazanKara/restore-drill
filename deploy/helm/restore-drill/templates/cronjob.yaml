apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "restore-drill.fullname" . }}
  labels:
    {{- include "restore-drill.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  jobTemplate:
    metadata:
      labels:
        {{- include "restore-drill.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.ttlSecondsAfterFinished }}
      ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished }}
      {{- end }}
      backoffLimit: {{ .Values.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      template:
        metadata:
          {{- with .Values.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          labels:
            {{- include "restore-drill.selectorLabels" . | nindent 12 }}
            {{- with .Values.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          serviceAccountName: {{ include "restore-drill.serviceAccountName" . }}
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          containers:
            - name: restore-drill
              image: {{ include "restore-drill.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - restore-drill
                - run
                - --config
                - /config/drill.yaml
                - --runtime
                - {{ .Values.runtime.mode | quote }}
                - --kube-namespace
                - {{ .Values.runtime.namespace | default .Release.Namespace | quote }}
                {{- with .Values.runtime.serviceAccountName }}
                - --kube-service-account
                - {{ . | quote }}
                {{- end }}
                {{- range $key, $value := .Values.runtime.podLabels }}
                - --kube-pod-label
                - {{ printf "%s=%s" $key $value | quote }}
                {{- end }}
                {{- range $key, $value := .Values.runtime.podAnnotations }}
                - --kube-pod-annotation
                - {{ printf "%s=%s" $key $value | quote }}
                {{- end }}
                {{- range .Values.runtime.imagePullSecrets }}
                - --kube-image-pull-secret
                - {{ . | quote }}
                {{- end }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              {{- with .Values.env }}
              env:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                {{- with .Values.extraVolumeMounts }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
          volumes:
            - name: config
              configMap:
                name: {{ if .Values.config.existingConfigMap }}{{ .Values.config.existingConfigMap }}{{ else }}{{ include "restore-drill.fullname" . }}{{ end }}
            - name: tmp
              emptyDir: {}
            {{- with .Values.extraVolumes }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
