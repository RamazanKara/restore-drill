version: "2"
run:
  go: "1.25"
linters:
  enable:
    - bodyclose
    - gosec
    - misspell
    - noctx
    - prealloc
    - unconvert
  settings:
    gosec:
      excludes:
        - G104
    govet:
      disable:
        - fieldalignment
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
        source: fmt\.Fprint|Flush\(\)|Close\(\)
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - gosec
        text: G304
      - linters:
          - gosec
        text: G115
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
